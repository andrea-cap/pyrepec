[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrepec"
version = "0.2.1"
description = "Python client for RePEc API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Giuseppe Acito" },
  { name = "Andrea Capitanelli" },
]
keywords = ["api", "client", "repec"]
dependencies = [
  "pydantic>=2.6.4,<3",
  "requests>=2.31,<3",
]

[dependency-groups]
dev = [
  "bump-my-version>=1.2,<2",
  "gitchangelog>=3,<4",
  "pytest>=8.1,<9",
  "pytest-cov>=5,<8",
  "pytest-xdist>=3.5,<4",
  "ruff>=0.15,<1",
]
[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bumpversion]
current_version = "0.2.1"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "README.md"
search = "Version: {current_version}"
replace = "Version: {new_version}"
